services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      VAANI_DEV_DB: ${VAANI_DEV_DB:-ephemeral}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 8

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_DATA_MODE: ${NEXT_PUBLIC_DATA_MODE:-mock}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_VAANI_PHONE: ${NEXT_PUBLIC_VAANI_PHONE:-}
        NEXT_PUBLIC_DEV_SIMULATE: ${NEXT_PUBLIC_DEV_SIMULATE:-false}
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
